<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--bg-page); padding: 28px; }
  .e { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .e .box { width:108px; height:72px; background:#fff; border-radius:12px; border:1px solid var(--border-hairline); }
  .e .nm  { font:var(--t-mono-s); color:var(--fg-1); }
  .e .px  { font:var(--t-caption); color:var(--fg-2); }
</style></head>
<body>
  <div style="display:flex;gap:14px;align-items:center">
    <div class="e">
      <div class="box" style="box-shadow:0 1px 2px rgba(21,22,52,0.04),0 1px 1px rgba(21,22,52,0.03)"></div>
      <div class="nm">--shadow-1</div><div class="px">hairline only</div>
    </div>
    <div class="e">
      <div class="box" style="box-shadow:0 2px 6px rgba(21,22,52,0.05),0 4px 14px rgba(139, 123, 232,0.06)"></div>
      <div class="nm">--shadow-2</div><div class="px">resting card</div>
    </div>
    <div class="e">
      <div class="box" style="box-shadow:0 8px 24px rgba(21,22,52,0.08),0 2px 6px rgba(21,22,52,0.05)"></div>
      <div class="nm">--shadow-3</div><div class="px">hover, dropdown</div>
    </div>
    <div class="e">
      <div class="box" style="box-shadow:0 24px 48px -12px rgba(21,22,52,0.18),0 8px 24px rgba(139, 123, 232,0.08)"></div>
      <div class="nm">--shadow-4</div><div class="px">modal, popover</div>
    </div>
  </div>
  <div class="sub" style="margin-top:14px;text-align:center">Indigo-tinted, never neutral grey. Lift = subtle violet glow + dark-navy contact shadow.</div>
</body></html>
