<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .stage { background: var(--ink-900); padding: 0; height: 240px; position:relative; overflow:hidden; }
  .stage img { position:absolute; width: 420px; height: 420px; mix-blend-mode: screen; opacity: 0.75; pointer-events:none; }
  .g1 { top: -120px; left: -100px; }
  .g2 { bottom: -180px; right: -120px; }
  .inner { position:relative; z-index: 1; padding: 36px 32px; color: #fff; display:flex; flex-direction:column; gap: 10px; height: 100%; box-sizing: border-box; justify-content: center; }
  .eyebrow { font:var(--t-mono-s); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.6); }
  .h { font: 600 36px/1.05 'Instrument Serif', serif; letter-spacing: -0.02em; max-width: 480px; }
  .h em { font-style: italic; color: #FFB8AB; font-weight: 400; }
</style></head>
<body>
  <div class="stage">
    <img class="g1" src="../assets/glow-indigo.png">
    <img class="g2" src="../assets/glow-coral.png">
    <div class="inner">
      <div class="eyebrow">Brand surface · hero</div>
      <div class="h">Find the right person. <em>In plain English.</em></div>
    </div>
  </div>
</body></html>
