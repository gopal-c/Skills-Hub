<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font:var(--t-mono-s); }
  .dot { width:6px; height:6px; border-radius:50%; }
  .b-match  { background:#E5F6F2; color:#2D8478; }
  .b-pending{ background:#FFF4DE; color:#8A5C0C; }
  .b-error  { background:#FFEDE5; color:#B6493A; }
  .b-info   { background:#F1ECFD; color:#5947C9; }
  .b-neutral{ background:var(--ink-100); color:var(--fg-1); }

  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font:var(--t-label); border:1px solid var(--border-hairline); background:var(--bg-surface); color:var(--fg-1); }
  .chip--active { background:var(--ink-900); color:#fff; border-color:var(--ink-900); }
  .chip .x { color:var(--fg-3); font:var(--t-mono-s); }

  .score { display:inline-flex; align-items:baseline; gap:4px; padding:4px 10px; border-radius:8px; background:var(--ink-900); color:#fff; font:var(--t-mono); }
  .score b { font-weight:600; color: var(--brand-teal); }
</style></head>
<body>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <span class="badge b-match"><span class="dot" style="background:#7CD3C5"></span>Strong match</span>
    <span class="badge b-pending"><span class="dot" style="background:#FFCB6B"></span>Pending review</span>
    <span class="badge b-error"><span class="dot" style="background:#FF9A82"></span>Couldn't parse</span>
    <span class="badge b-info"><span class="dot" style="background:#8B7BE8"></span>AI extracted</span>
    <span class="badge b-neutral">Draft</span>
  </div>
  <div style="height:14px"></div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <span class="chip chip--active">React <span class="x">×</span></span>
    <span class="chip">TypeScript</span>
    <span class="chip">Payments</span>
    <span class="chip">+ Add filter</span>
    <span class="score">0.92 <b>match</b></span>
    <span class="score" style="background:#3A3A4A">0.71 <b style="color:#FFCB6B">match</b></span>
  </div>
</body></html>
