<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="row" style="gap:6px">
    <!-- Indigo ramp -->
    <div class="col" style="flex:1;gap:6px">
      <div class="label">Indigo</div>
      <div class="swatch" style="background:#F1ECFD;min-height:48px;padding:8px;color:#1A1A2E"><div class="val">soft · #F1ECFD</div></div>
      <div class="swatch" style="background:#8B7BE8;min-height:48px;padding:8px"><div class="val">base · #8B7BE8</div></div>
      <div class="swatch" style="background:#6B58D9;min-height:48px;padding:8px"><div class="val">deep · #6B58D9</div></div>
    </div>
    <div class="col" style="flex:1;gap:6px">
      <div class="label">Coral</div>
      <div class="swatch" style="background:#FFEDE5;min-height:48px;padding:8px;color:#1A1A2E"><div class="val">soft · #FFEDE5</div></div>
      <div class="swatch" style="background:#FF9A82;min-height:48px;padding:8px"><div class="val">base · #FF9A82</div></div>
      <div class="swatch" style="background:#E87760;min-height:48px;padding:8px"><div class="val">deep · #E87760</div></div>
    </div>
    <div class="col" style="flex:1;gap:6px">
      <div class="label">Teal</div>
      <div class="swatch" style="background:#E5F6F2;min-height:48px;padding:8px;color:#1A1A2E"><div class="val">soft · #E5F6F2</div></div>
      <div class="swatch" style="background:#7CD3C5;min-height:48px;padding:8px"><div class="val">base · #7CD3C5</div></div>
      <div class="swatch" style="background:#5BBFB0;min-height:48px;padding:8px"><div class="val">deep · #5BBFB0</div></div>
    </div>
    <div class="col" style="flex:1;gap:6px">
      <div class="label">Amber</div>
      <div class="swatch" style="background:#FFF4DE;min-height:48px;padding:8px;color:#1A1A2E"><div class="val">soft · #FFF4DE</div></div>
      <div class="swatch" style="background:#FFCB6B;min-height:48px;padding:8px;color:#1A1A2E"><div class="val">base · #FFCB6B</div></div>
      <div class="swatch" style="background:#E8A943;min-height:48px;padding:8px"><div class="val">deep · #E8A943</div></div>
    </div>
  </div>
</body></html>
