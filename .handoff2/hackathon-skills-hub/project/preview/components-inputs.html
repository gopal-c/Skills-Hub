<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .field { display:flex; flex-direction:column; gap:6px; flex:1; }
  .field label { font:var(--t-label); color:var(--fg-1); }
  .input { font:var(--t-body); padding: 10px 12px; border-radius: var(--r-md); border:1px solid var(--border-strong); background: var(--bg-surface); color: var(--fg-1); width:100%; box-sizing:border-box; transition: all var(--t-base) var(--ease-out); }
  .input:focus { outline:none; border-color: var(--border-focus); box-shadow: var(--shadow-focus); }
  .input::placeholder { color: var(--fg-3); }
  .help { font:var(--t-body-s); color: var(--fg-2); }
  .search { position:relative; flex:1; }
  .search .input { padding-left: 36px; }
  .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--fg-3); }
</style></head>
<body>
  <div class="row" style="gap:14px">
    <div class="field">
      <label>Job title</label>
      <input class="input" value="Senior frontend engineer">
    </div>
    <div class="field">
      <label>Team</label>
      <input class="input" placeholder="Search teams…">
    </div>
  </div>
  <div style="height:14px"></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input class="input" placeholder="Who knows React AND has worked on payment integrations?">
  </div>
  <div class="help" style="margin-top:6px">Ask in plain English. We rank by meaning, not keywords.</div>
</body></html>
