<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label" style="margin-bottom:10px">Ink scale · violet-tinted neutrals</div>
  <div class="row" style="gap:0">
    <div class="swatch light" style="background:#FFFFFF;flex:1;min-height:78px;border-radius:8px 0 0 8px;border-right:none"><div class="val">0 · #FFFFFF</div></div>
    <div class="swatch light" style="background:#FAFAFC;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">50</div></div>
    <div class="swatch light" style="background:#F4F4F8;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">100</div></div>
    <div class="swatch light" style="background:#E8E8F0;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">200</div></div>
    <div class="swatch light" style="background:#D4D4E0;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">300</div></div>
    <div class="swatch light" style="background:#B8B8D0;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">400</div></div>
    <div class="swatch" style="background:#8888A0;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">500</div></div>
    <div class="swatch" style="background:#5B5B6E;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">600</div></div>
    <div class="swatch" style="background:#3A3A4A;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">700</div></div>
    <div class="swatch" style="background:#1A1A2E;flex:1;min-height:78px;border-radius:0;border-right:none"><div class="val">800</div></div>
    <div class="swatch" style="background:#151634;flex:1;min-height:78px;border-radius:0 8px 8px 0"><div class="val">900</div></div>
  </div>
  <div style="margin-top:10px" class="sub">Cool, violet-tinted — never neutral grey. Pure black <code style="font:var(--t-mono-s)">#000</code> is never used; <code style="font:var(--t-mono-s)">--ink-900</code> is the deepest surface.</div>
</body></html>
