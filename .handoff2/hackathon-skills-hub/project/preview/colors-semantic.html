<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .sem { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border-hairline); border-radius:var(--r-md); background:var(--bg-surface); }
  .sem .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .sem .name { font:var(--t-label); }
  .sem .val { font:var(--t-mono-s); color:var(--fg-2); margin-left:auto; }
</style></head>
<body>
  <div class="col" style="gap:8px">
    <div class="sem"><span class="dot" style="background:#7CD3C5"></span><span class="name">Success</span><span class="sub">Matched · saved · ingested</span><span class="val">--status-success</span></div>
    <div class="sem"><span class="dot" style="background:#FFCB6B"></span><span class="name">Warning</span><span class="sub">Pending review · low confidence</span><span class="val">--status-warning</span></div>
    <div class="sem"><span class="dot" style="background:#FF9A82"></span><span class="name">Danger</span><span class="sub">Errors · destructive actions</span><span class="val">--status-danger</span></div>
    <div class="sem"><span class="dot" style="background:#8B7BE8"></span><span class="name">Info</span><span class="sub">Reasoning · explanations</span><span class="val">--status-info</span></div>
  </div>
</body></html>
