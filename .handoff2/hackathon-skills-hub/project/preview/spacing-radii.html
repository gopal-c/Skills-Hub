<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .r { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .r .box { width:72px; height:72px; background:var(--brand-indigo-soft); border:1px solid #DDD2FB; }
  .r .nm  { font:var(--t-mono-s); color:var(--fg-1); }
  .r .px  { font:var(--t-caption); color:var(--fg-2); }
</style></head>
<body>
  <div style="display:flex;gap:14px;align-items:flex-end">
    <div class="r"><div class="box" style="border-radius:4px"></div><div class="nm">--r-xs</div><div class="px">4 · chips inner</div></div>
    <div class="r"><div class="box" style="border-radius:6px"></div><div class="nm">--r-sm</div><div class="px">6 · tiny tags</div></div>
    <div class="r"><div class="box" style="border-radius:10px"></div><div class="nm">--r-md</div><div class="px">10 · inputs</div></div>
    <div class="r"><div class="box" style="border-radius:14px"></div><div class="nm">--r-lg</div><div class="px">14 · cards</div></div>
    <div class="r"><div class="box" style="border-radius:22px"></div><div class="nm">--r-xl</div><div class="px">22 · hero / modal</div></div>
    <div class="r"><div class="box" style="border-radius:9999px"></div><div class="nm">--r-pill</div><div class="px">badges, chips</div></div>
  </div>
</body></html>
