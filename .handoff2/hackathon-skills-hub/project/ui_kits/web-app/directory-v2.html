<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsHub — Directory (ID cards)</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font: var(--t-body);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    

    /* ── Page header ───────────────────────────────────────── */
    .page { max-width: 1240px; margin: 0 auto; padding: 56px 32px 64px; }
    .eyebrow {
      font: var(--t-mono-s); letter-spacing: var(--tracking-eyebrow);
      text-transform: uppercase; color: var(--fg-2);
    }
    .h-title {
      font: 600 56px/1.05 var(--font-sans);
      letter-spacing: -0.025em;
      color: var(--fg-1);
      margin: 6px 0 8px;
    }
    .h-sub { font: var(--t-body-l); color: var(--fg-2); max-width: 620px; }

    /* ── Toolbar ───────────────────────────────────────────── */
    .toolbar {
      margin: 28px 0 22px;
      display: flex; align-items: center; gap: 10px;
    }
    .search {
      flex: 1; max-width: 420px;
      position: relative;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(232, 232, 240, 0.9);
      border-radius: var(--r-pill);
      padding: 8px 14px 8px 38px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, var(--shadow-1);
    }
    .search input {
      width: 100%; border: none; outline: none; background: transparent;
      font: var(--t-body); color: var(--fg-1);
    }
    .search input::placeholder { color: var(--fg-3); }
    .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 13px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(232, 232, 240, 0.9);
      border-radius: var(--r-pill);
      font: var(--t-label); color: var(--fg-1);
      cursor: pointer;
      transition: all var(--t-fast) var(--ease-out);
    }
    .chip:hover { background: rgba(255,255,255,0.85); }
    .chip.active { background: var(--ink-900); color: #fff; border-color: var(--ink-900); }

    /* ── Card grid ─────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    /* ── The ID-badge card ────────────────────────────────── */
    .card {
      position: relative;
      border-radius: 22px;
      cursor: pointer;
      padding: 22px 20px 18px;
      /* Stronger frost — higher transparency, deeper blur */
      background: linear-gradient(160deg,
                    rgba(255, 255, 255, 0.55) 0%,
                    rgba(255, 255, 255, 0.32) 50%,
                    rgba(255, 255, 255, 0.45) 100%);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95) inset,
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 24px 50px -20px rgba(21, 22, 52, 0.22),
        0 4px 14px rgba(21, 22, 52, 0.06);
      transition: transform var(--t-base) var(--ease-spring),
                  box-shadow var(--t-base) var(--ease-out);
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95) inset,
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 30px 56px -16px rgba(21, 22, 52, 0.28),
        0 6px 18px rgba(91, 71, 224, 0.14);
    }
    /* Stronger diagonal sheen — the glass is more lustrous now */
    .card::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg,
                    rgba(255,255,255,0.65) 0%,
                    rgba(255,255,255,0.10) 28%,
                    transparent 50%,
                    rgba(255,255,255,0.10) 75%,
                    rgba(255,255,255,0.35) 100%);
      pointer-events: none;
      mix-blend-mode: overlay;
    }
    /* The badge lanyard hole — tiny detail that sells "ID card" */
    .card::after {
      content: "";
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 38px; height: 6px;
      border-radius: 999px;
      background: rgba(21, 22, 52, 0.10);
      box-shadow: 0 1px 0 rgba(255,255,255,0.6);
      z-index: 1;
    }

    /* ── Avatar — the hero of the card ────────────────────── */
    .avatar-wrap {
      position: relative;
      margin: 22px 0 16px;
    }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font: 300 32px/1 var(--font-sans);
      letter-spacing: 0.01em;
      box-shadow:
        0 10px 24px rgba(21, 22, 52, 0.22),
        0 0 0 4px rgba(255,255,255,0.65),
        0 0 0 5px rgba(21, 22, 52, 0.06);
    }
    /* Soft halo glow behind the avatar — picks up its colour */
    .avatar-wrap::before {
      content: "";
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--halo, rgba(139,123,232,0.35)) 0%, transparent 65%);
      filter: blur(8px);
      z-index: -1;
    }
    /* Status dot — "approved" indicator on the avatar */
    .avatar-wrap .status {
      position: absolute; bottom: 4px; right: 4px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--brand-teal);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.85);
    }
    .avatar-wrap .status.pending {
      background: var(--brand-coral-deep);
    }

    .name {
      font: 600 19px/1.2 var(--font-sans);
      letter-spacing: -0.01em;
      color: var(--fg-1);
    }
    .level-pill {
      margin-top: 8px;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 11px;
      border-radius: 999px;
      font: var(--t-mono-s);
      letter-spacing: var(--tracking-eyebrow); text-transform: uppercase;
      color: var(--brand-indigo-deep);
      background: rgba(139, 123, 232, 0.14);
      border: 1px solid rgba(139, 123, 232, 0.25);
    }
    .level-pill.lead   { color: #C75A45; background: rgba(255,154,130,0.18); border-color: rgba(255,154,130,0.35); }
    .level-pill.senior { color: #2D8478; background: rgba(124,211,197,0.20); border-color: rgba(124,211,197,0.35); }
    .level-pill.mid    { color: #8A5C0C; background: rgba(255,203,107,0.22); border-color: rgba(255,203,107,0.40); }

    .loc {
      font: var(--t-body-s); color: var(--fg-2);
      margin-top: 10px;
      display: inline-flex; align-items: center; gap: 4px;
    }

    /* ── ID-row separator — the badge's data strip ────────── */
    .id-row {
      width: 100%;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed rgba(21, 22, 52, 0.12);
      display: flex; align-items: center; justify-content: space-between;
      font: var(--t-mono-s); letter-spacing: 0.08em;
      color: var(--fg-2);
      text-transform: uppercase;
    }
    .id-row .yrs { color: var(--fg-1); font-weight: 500; }

    /* Pending Review badge — replaces the ID slot when status=pending */
    .id-row .pending-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px 3px 7px;
      border-radius: 999px;
      font: var(--t-mono-s);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #C75A45;
      background: rgba(255, 154, 130, 0.18);
      border: 1px solid rgba(255, 154, 130, 0.45);
    }
    .id-row .pending-badge::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--brand-coral-deep);
      box-shadow: 0 0 0 2px rgba(255, 154, 130, 0.30);
    }

    .skills {
      display: flex; gap: 5px; flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }
    .skill {
      font: var(--t-mono-s);
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(232, 232, 240, 0.85);
      color: var(--fg-1);
    }
    .skill.more {
      background: rgba(26, 26, 46, 0.85);
      color: #fff;
      border-color: transparent;
    }
  </style>
</head>
<body data-theme="light">


  <div class="theme-glow g1"></div>
  <div class="theme-glow g2"></div>
  <div class="theme-glow g3"></div>
  <header class="topbar">
    <img class="theme-logo-light" src="../../assets/logo-wordmark.svg" alt="SkillsHub">
    <img class="theme-logo-dark"  src="../../assets/logo-wordmark-dark.svg" alt="SkillsHub">
    <span class="divider">/</span>
    <span class="crumb">Directory</span>
    <div class="right">
      <span class="role">role: <b>HR</b></span>
      <span class="tab active">Directory</span>
      <span class="tab">Switch role</span>
    </div>
  </header>

  <main class="page">
    <div class="eyebrow">Directory</div>
    <h1 class="h-title">14 people</h1>
    <p class="h-sub">Approved profiles, ready to be searched. Click any card to see the full picture.</p>

    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="Find anyone — name, skill, location…">
      </div>
      <button class="chip active">All</button>
      <button class="chip">Engineering</button>
      <button class="chip">Design</button>
      <button class="chip">Senior+</button>
      <button class="chip">Remote</button>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <script>
    const PEOPLE = [
      { name: 'Naveen Rao',      level: 'junior', loc: 'Mumbai',     yrs: 2,  skills: ['Node.js', 'Express', 'MongoDB', '+2'], grad: ['#FF9A82','#FFCB6B'], halo: 'rgba(255,154,130,0.45)', pending: true },
      { name: 'Riya Gupta',      level: 'mid',    loc: 'Bangalore',  yrs: 4,  skills: ['Next.js', 'TypeScript', 'tRPC', '+3'], grad: ['#8B7BE8','#FF9A82'], halo: 'rgba(139,123,232,0.40)' },
      { name: 'Aditya Nair',     level: 'senior', loc: 'Pune',       yrs: 9,  skills: ['Java', 'Kafka', 'Elastic', '+3'], grad: ['#7CD3C5','#8B7BE8'], halo: 'rgba(124,211,197,0.45)' },
      { name: 'Ishita Choudhary',level: 'junior', loc: 'Remote',     yrs: 2,  skills: ['React', 'TypeScript', 'Tailwind', '+2'], grad: ['#FFCB6B','#FF9A82'], halo: 'rgba(255,203,107,0.45)' },
      { name: 'Devansh Patel',   level: 'senior', loc: 'Hyderabad',  yrs: 7,  skills: ['Python', 'FastAPI', 'PyTorch', '+2'], grad: ['#8B7BE8','#7CD3C5'], halo: 'rgba(139,123,232,0.40)' },
      { name: 'Tara Banerjee',   level: 'mid',    loc: 'Bangalore',  yrs: 5,  skills: ['React', 'Figma', 'Design sys.', '+2'], grad: ['#FF9A82','#8B7BE8'], halo: 'rgba(255,154,130,0.45)' },
      { name: 'Karan Joshi',     level: 'lead',   loc: 'Mumbai',     yrs: 13, skills: ['TypeScript', 'GraphQL', 'Leadership', '+2'], grad: ['#7CD3C5','#FFCB6B'], halo: 'rgba(124,211,197,0.45)' },
      { name: 'Meera Krishnan',  level: 'mid',    loc: 'Pune',       yrs: 5,  skills: ['React Native', 'Node', 'GraphQL', '+1'], grad: ['#FFCB6B','#7CD3C5'], halo: 'rgba(255,203,107,0.45)' },
    ];

    const initials = n => n.split(' ').map(s => s[0]).join('').slice(0, 2);
    const empId = (n, i) => `SH-${String(2025).slice(-2)}${String(i + 1).padStart(3, '0')}`;

    const grid = document.getElementById('grid');
    PEOPLE.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="avatar-wrap" style="--halo: ${p.halo};">
          <div class="avatar" style="background: linear-gradient(135deg, ${p.grad[0]}, ${p.grad[1]});">${initials(p.name)}</div>
          <span class="status ${p.pending ? 'pending' : ''}" title="${p.pending ? 'Pending review' : 'Approved'}"></span>
        </div>
        <div class="name">${p.name}</div>
        <span class="level-pill ${p.level}">${p.level}</span>
        <div class="loc">${p.loc}</div>
        <div class="skills">
          ${p.skills.map(s => `<span class="skill${s.startsWith('+') ? ' more' : ''}">${s}</span>`).join('')}
        </div>
        <div class="id-row">
          ${p.pending
            ? `<span class="pending-badge">Pending review</span>`
            : `<span>${empId(p.name, i)}</span>`}
          <span class="yrs">${p.yrs} yrs</span>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
